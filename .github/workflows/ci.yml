name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { node: [18, 20, 22] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      # Test against the SDK's main branch (also works before @horusship/sdk is on npm).
      - uses: actions/checkout@v4
        with: { repository: HorusShip/horus-node, path: _sdk }
      - run: cd _sdk && npm install --no-audit --no-fund && npm run build
      - run: npm pkg set "dependencies.@horusship/sdk=file:./_sdk" && npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
